<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — PixelBoost PropLeadAi</title>
  <link rel="icon" type="image/png" href="logo_icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-color: var(--bg-app);
      background-image: 
        radial-gradient(at 0% 0%, rgba(2, 132, 199, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(5, 150, 105, 0.06) 0px, transparent 50%);
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 38px 32px;
      box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.08), 0 0 0 1px #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .auth-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
    }

    .auth-logo {
      height: 48px;
      width: auto;
      object-fit: contain;
    }

    .auth-title h1 {
      font-family: var(--font-brand);
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .auth-title p {
      font-size: 0.84rem;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .auth-footer-text {
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-dim);
      padding-top: 12px;
      border-top: 1px solid var(--border-light);
    }

    .demo-credentials-box {
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 0.78rem;
      color: #0369a1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .demo-credentials-box strong {
      color: #0c4a6e;
    }
  </style>
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <img src="logo_badge.png" alt="PixelBoost" class="auth-logo">
      <div class="auth-title">
        <h1>PixelBoost <span style="color: var(--primary-cyan);">PropLeadAi</span></h1>
        <p>Sign in to access your lead generator & CRM workspace</p>
      </div>
    </div>

    <!-- Master Admin Quick Helper / Demo Credentials -->
    <div class="demo-credentials-box">
      <div><strong>Master Admin Access:</strong></div>
      <div>Email: <code>admin@pixelboost.in</code></div>
      <div>Password: <code>Admin@PixelBoost2026!</code></div>
    </div>

    <form class="auth-form" id="login-form">
      <div class="form-row">
        <label class="form-label" for="login-email">Email Address</label>
        <input type="email" id="login-email" class="text-field" placeholder="name@company.com" required autofocus>
      </div>

      <div class="form-row">
        <label class="form-label" for="login-password">Password</label>
        <input type="password" id="login-password" class="text-field" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-hero btn-extract" id="btn-login-submit" style="margin-top: 8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
          <polyline points="10 17 15 12 10 7"></polyline>
          <line x1="15" y1="12" x2="3" y2="12"></line>
        </svg>
        <span>Sign In to Dashboard</span>
      </button>
    </form>

    <div class="auth-footer-text">
      Made with <span class="heart-pulse">❤️</span> by <strong>CK</strong> • PixelBoost Agency
    </div>
  </div>

  <div class="toast-wrapper" id="toast-container"></div>

  <script>
    const form = document.getElementById('login-form');
    const emailInput = document.getElementById('login-email');
    const passInput = document.getElementById('login-password');
    const submitBtn = document.getElementById('btn-login-submit');

    // If token already present, test /api/auth/me
    const existingToken = localStorage.getItem('pixelboost_token');
    if (existingToken) {
      fetch('/api/auth/me', {
        headers: { 'Authorization': `Bearer ${existingToken}` }
      })
      .then(res => res.json())
      .then(data => {
        if (data.id) {
          window.location.href = '/';
        }
      })
      .catch(() => {});
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      const password = passInput.value;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Verifying...</span>';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || 'Login failed.');
        }

        localStorage.setItem('pixelboost_token', data.access_token);
        localStorage.setItem('pixelboost_user', JSON.stringify(data.user));

        showToast('Login successful! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = '/';
        }, 600);

      } catch (err) {
        showToast(err.message, 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
          <span>Sign In to Dashboard</span>
        `;
      }
    });

    function showToast(msg, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast-item';
      if (type === 'error') toast.style.background = '#e11d48';
      if (type === 'success') toast.style.background = '#059669';
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 4000);
    }
  </script>
</body>
</html>
